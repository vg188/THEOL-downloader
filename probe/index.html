<body>
  <h1>THEOL 书签兼容性测试</h1>
  <p>此测试用于确认课程页面能否运行轻量版书签程序。</p>
  <div class="note"><strong>隐私边界：</strong>测试仅读取一份预览元数据页面，不会下载课件正文，不会上传页面内容、文件名、账号信息或测试结果。</div>
  <ol class="steps"><li>按 <code>Ctrl+Shift+B</code> 显示书签栏。</li><li>把下面按钮拖到书签栏。</li><li>打开已登录的 THEOL 当前课件目录，点击该书签。</li></ol>
  <p><a id="probe-bookmarklet" class="install" href="__PROBE_BOOKMARKLET__">远程加载测试</a></p>
  <p><strong>若远程加载失败：</strong>请删除刚才的测试书签，再把下面的自包含测试拖到书签栏运行。它不加载 GitHub 脚本。</p>
  <p><a id="probe-standalone" class="install" href="__PROBE_STANDALONE__">拖到书签栏：自包含测试</a></p>
  <p>测试完成后，只需告诉开发者五项结果是“成功”还是“失败”，不要发送课程名、文件名、页面源码或账号信息。</p>
</body>
</html>
