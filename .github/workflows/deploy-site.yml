name: Deploy website

# The published artifact is the built website plus the self-contained bookmarklet
# embedded in it. Nothing else may reach Pages: no extension bundle, no probe page,
# no browser profiles or downloaded courseware. The bookmarklet loads no remote
# runtime, so publishing this site cannot break a bookmark someone already saved.
on:
  push:
    branches: [codex/bookmarklet-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm test` covers the source suites, including the site build assertions:
      # the site is only deployed from a tree whose own checks pass.
      - run: npm test
      - run: npm run test:bookmarklet
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
