name: Deploy bookmarklet feasibility probe

on:
  push:
    branches: [codex/bookmarklet-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-probe
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:probe
      - run: npm run build:probe
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/probe
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy probe
        id: deployment
        uses: actions/deploy-pages@v4
