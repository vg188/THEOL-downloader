<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 182" fill="none"><title>把课程资源助手拖到浏览器书签栏</title><g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="538" height="180" rx="12" fill="#f9fbff" stroke="#d5dff1"/><path d="M1 45h538M1 84h538" stroke="#d5dff1"/><rect x="18" y="13" width="504" height="22" rx="6" fill="#edf1f8"/><text x="31" y="28" font-size="11" fill="#53637e">浏览器</text><text x="20" y="69" font-size="12" fill="#53637e">书签栏</text><rect x="81" y="54" width="118" height="22" rx="5" fill="#e8efff" stroke="#b6c9f5" stroke-dasharray="4 3"/><text x="98" y="69" font-size="11" fill="#1d4ed8">课程资源助手</text><path d="M338 123c-13-28-61-55-122-58" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5 4"/><path d="m223 59-10 6 9 6" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="280" y="121" width="216" height="41" rx="8" fill="#1d4ed8"/><text x="303" y="147" font-size="14" font-weight="600" fill="white">按住按钮，拖到书签栏</text><text x="21" y="139" font-size="12" fill="#53637e">不是在本页点击运行</text></g></svg>